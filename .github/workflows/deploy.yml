name: Production Deploy Voice Assistant (Hardened)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH (Hardened)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -euo pipefail

            PROJECT_DIR="services/voice-assistant"
            cd "$PROJECT_DIR"

            echo "================================="
            echo "🚀 START PRODUCTION DEPLOY"
            echo "================================="

            # =========================
            # 1. BACKUP DATABASE (HARD GATE)
            # =========================
            echo "💾 BACKUP DATABASE"

            mkdir -p backups

            BACKUP_FILE="backup_$(date +%Y%m%d_%H%M%S).sql"

            if ! docker exec voice-assistant-postgres \
              pg_dump -U "$DB_USER" "$DB_NAME" > "backups/$BACKUP_FILE"; then
              echo "❌ DB backup failed - ABORT DEPLOY"
              exit 1
            fi

            if [ ! -s "backups/$BACKUP_FILE" ]; then
              echo "❌ Backup file is empty - ABORT DEPLOY"
              exit 1
            fi

            echo "✅ Backup OK: $BACKUP_FILE"

            # =========================
            # 2. PULL LATEST CODE
            # =========================
            echo "📥 PULL LATEST CODE"

            git fetch origin master
            git reset --hard origin/master

            # =========================
            # 3. BUILD & DEPLOY
            # =========================
            echo "🐳 BUILD & DEPLOY"

            if ! docker compose -f docker-compose.production.yml up -d --build; then
              echo "❌ Docker build failed"
              exit 1
            fi

            # =========================
            # 4. HEALTH CHECK (GATE)
            # =========================
            echo "❤️ HEALTH CHECK"

            for i in {1..12}; do
              if curl -fs http://localhost/health; then
                echo "✅ HEALTH CHECK PASSED"
                break
              fi

              echo "⏳ Waiting... attempt $i"
              sleep 5

              if [ $i -eq 12 ]; then
                echo "❌ HEALTH CHECK FAILED"

                # =========================
                # 5. ROLLBACK CODE
                # =========================
                echo "🔁 ROLLBACK CODE"

                git reset --hard HEAD~1
                docker compose -f docker-compose.production.yml up -d --build

                exit 1
              fi
            done

            # =========================
            # 6. FINAL VERIFICATION
            # =========================
            echo "🔍 FINAL CHECK"

            docker ps | grep voice-assistant

            echo "🎉 DEPLOY SUCCESSFUL"

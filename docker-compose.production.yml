version: "3.9"

services:
  # =========================
  # NGINX GATEWAY (HTTPS + SOCKET + API)
  # =========================
  nginx:
    image: nginx:alpine
    container_name: voice-assistant-nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # SSL CERTS

    depends_on:
      - frontend
      - backend
      - ai-services

    restart: unless-stopped
    networks:
      - voice-assistant-network

  # =========================
  # FRONTEND (React/Vue build)
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: voice-assistant-frontend

    restart: unless-stopped

    networks:
      - voice-assistant-network

  # =========================
  # BACKEND (Node/Express + Socket.IO)
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: voice-assistant-backend

    expose:
      - "3000"

    env_file:
      - ./backend/.env

    environment:
      - TZ=Asia/Ho_Chi_Minh
      - DB_HOST=postgres
      - REDIS_HOST=redis

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./backend/logs:/app/logs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    restart: unless-stopped
    networks:
      - voice-assistant-network

  # =========================
  # AI SERVICES (Flask/FastAPI)
  # =========================
  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile

    container_name: voice-assistant-ai-services

    expose:
      - "5000"

    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - TZ=Asia/Ho_Chi_Minh

    volumes:
      - ./ai-services/models:/app/models
      - ./ai-services/data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

    restart: unless-stopped
    networks:
      - voice-assistant-network

  # =========================
  # POSTGRES
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: voice-assistant-postgres

    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - TZ=Asia/Ho_Chi_Minh

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped
    networks:
      - voice-assistant-network

  # =========================
  # REDIS
  # =========================
  redis:
    image: redis:7-alpine
    container_name: voice-assistant-redis

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped
    networks:
      - voice-assistant-network

# =========================
# VOLUMES
# =========================
volumes:
  postgres_data:
  redis_data:

# =========================
# NETWORK
# =========================
networks:
  voice-assistant-network:
    driver: bridge

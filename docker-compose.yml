services:
  # =========================
  # FRONTEND
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voice-assistant-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - voice-assistant-network

  # =========================
  # BACKEND
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice-assistant-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"

    env_file:
      - ./backend/.env

    environment:
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - ./backend/logs:/app/logs

    restart: unless-stopped
    networks:
      - voice-assistant-network

  # =========================
  # AI SERVICES
  # =========================
  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: voice-assistant-ai-services

    ports:
      - "${AI_SERVICES_PORT:-5000}:5000"

    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app

    volumes:
      - ./ai-services/models:/app/models
      - ./ai-services/data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:5000')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped
    networks:
      - voice-assistant-network

  # =========================
  # POSTGRES
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: voice-assistant-postgres

    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped
    networks:
      - voice-assistant-network

  # =========================
  # REDIS
  # =========================
  redis:
    image: redis:7-alpine
    container_name: voice-assistant-redis

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped
    networks:
      - voice-assistant-network

volumes:
  postgres_data:
  redis_data:

networks:
  voice-assistant-network:
    driver: bridge
